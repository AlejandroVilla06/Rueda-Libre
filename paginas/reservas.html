<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | Rueda Libre</title>
    <meta name="description" content="Reserva tu bicicleta en Rueda Libre, alquiler de bicicletas en Medellin">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Rueda Libre</h1>
        <p>Bienvenidos a la mejor pagina de ventas de bisicletas <a href="#encuentranos">Visitanos</a></p>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="paginas/tarifas.html">Tarifas y rutas</a>
            <a href="paginas/reservas.html">Reservas</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Reserva tu bicicleta</h2>

            <form>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>

                <label for="fecha">Fecha de reserva</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="tipo">Tipo de bicicleta</label>
                <select id="tipo" name="tipo">
                    <option value="">Seleccioná una opción</option>
                    <option value="urbana">Urbana</option>
                    <option value="montana">Montaña</option>
                    <option value="electrica">Eléctrica</option>
                </select>

                <button type="submit">Reservar</button>
            </form>


        </section>
        
        <section>
            <h2>Horario de atención</h2>
            <dl>
                <dt>Lunes a viernes</dt>
                <dd>7:00 a. m. a 7:00 p. m.</dd>

                <dt>Sábados, domingos y festivos</dt>
                <dd>6:00 a. m. a 2:00 p. m.</dd>
            </dl>
        </section>

    </main>
    
    <footer>
        <p>Rueda Libre · <a href="mailto:hola@ruedalibre.com">hola@ruedalibre.com</a> · 2025</p>
    </footer>    
</body>
</html>
