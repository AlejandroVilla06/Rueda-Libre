<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rueda Nocturna · Campaña</title>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-slate-950 min-h-screen">

  <!-- Hero -->
  <section class="max-w-2xl mx-auto px-6 py-16 text-center">

    <span class="inline-block bg-amber-400/10 text-amber-400 text-xs font-semibold uppercase tracking-widest px-4 py-1.5 rounded-full mb-6">
      Nuevo · Jueves a sábado
    </span>

    <h1 class="text-5xl font-extrabold text-white mb-4">Rueda Nocturna</h1>

    <p class="text-xl text-slate-400 mb-10">
      Descubre Medellín de noche en bicicleta
    </p>

    <div class="flex justify-center gap-10 mb-12">
      <div>
        <p class="text-3xl font-bold text-white">3</p>
        <p class="text-sm text-slate-500">Rutas</p>
      </div>
      <div>
        <p class="text-3xl font-bold text-white">15 km</p>
        <p class="text-sm text-slate-500">Promedio</p>
      </div>
      <div>
        <p class="text-3xl font-bold text-white">7:00 p.m.</p>
        <p class="text-sm text-slate-500">Salida</p>
      </div>
    </div>

    <a href="#inscripcion"
       class="inline-block bg-amber-400 text-slate-900 font-semibold text-lg px-8 py-3.5 rounded-full hover:bg-amber-300 focus:outline-hidden focus:ring-2 focus:ring-amber-200 transition-colors">
      Inscríbete
    </a>
  </section>

  <!-- Kit de botones -->
  <section class="max-w-2xl mx-auto px-6 py-12">
    <h2 class="text-2xl font-bold text-white mb-8">Kit de componentes · Botones</h2>

    <div class="flex flex-wrap gap-4 items-center">

      <!-- Principal -->
      <a href="#"
         class="inline-block bg-amber-400 text-slate-900 font-semibold px-6 py-3 rounded-full hover:bg-amber-300 focus:outline-hidden focus:ring-2 focus:ring-amber-200 transition-colors">
        Principal
      </a>

      <!-- Secundario -->
      <a href="#"
         class="inline-block bg-slate-700 text-white font-semibold px-6 py-3 rounded-full hover:bg-slate-600 focus:outline-hidden focus:ring-2 focus:ring-slate-500 transition-colors">
        Secundario
      </a>

      <!-- Contorno -->
      <a href="#"
         class="inline-block border-2 border-amber-400 text-amber-400 font-semibold px-6 py-3 rounded-full hover:bg-amber-400 hover:text-slate-900 focus:outline-hidden focus:ring-2 focus:ring-amber-200 transition-colors">
        Contorno
      </a>

    </div>
  </section>

</body>
</html>
